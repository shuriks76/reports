<!DOCTYPE html>
<html lang="ru" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отправка отчёта в WhatsApp</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        wa: {
                            500: '#25D366',
                            600: '#128C7E',
                            700: '#075E54',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="min-h-full flex items-center justify-center p-4 sm:p-6 text-slate-800 antialiased">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-200/80 overflow-hidden relative">
        
        <!-- Header Banner -->
        <div class="bg-gradient-to-r from-wa-700 to-wa-600 p-6 text-white text-center relative">
            <div class="w-14 h-14 bg-white/10 backdrop-blur-md rounded-2xl flex items-center justify-center mx-auto mb-3 border border-white/20 text-2xl shadow-inner">
                📋
            </div>
            <h1 class="text-xl font-bold tracking-tight">Ежемесячный отчёт</h1>
            <p class="text-xs text-emerald-100/90 mt-1">Заполните поля и нажмите кнопку для отправки</p>
        </div>

        <form id="reportForm" onsubmit="handleFormSubmit(event)" class="p-6 space-y-6">
            
            <!-- Field 1: Service Participation Checkbox -->
            <div class="bg-slate-50 border border-slate-200/80 rounded-2xl p-4 transition-all hover:border-emerald-300">
                <label class="flex items-center justify-between cursor-pointer select-none">
                    <span class="text-sm font-semibold text-slate-800 pr-3">
                        Я участвовал в служении
                    </span>
                    <input type="checkbox" id="participated" checked
                        class="w-6 h-6 text-emerald-500 rounded-lg border-slate-300 focus:ring-emerald-500 accent-emerald-500 cursor-pointer">
                </label>
            </div>

            <!-- Field 2: Hours Input -->
            <div class="space-y-1.5">
                <label for="hours" class="block text-xs font-bold text-slate-600 uppercase tracking-wider">
                    Количество часов (пионерам)
                </label>
                <div class="relative">
                    <input type="number" id="hours" min="0" step="1" placeholder="0"
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-base font-semibold text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all">
                    <span class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-xs font-medium text-slate-400">
                        ч.
                    </span>
                </div>
            </div>

            <!-- Field 3: Studies Input -->
            <div class="space-y-1.5">
                <label for="studies" class="block text-xs font-bold text-slate-600 uppercase tracking-wider">
                    Количество изучений
                </label>
                <div class="relative">
                    <input type="number" id="studies" min="0" step="1" placeholder="0"
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-base font-semibold text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all">
                    <span class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-xs font-medium text-slate-400">
                        кол-во
                    </span>
                </div>
            </div>

            <button type="submit" 
                class="w-full bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white font-bold py-4 px-6 rounded-2xl shadow-lg shadow-emerald-500/25 transition-all flex items-center justify-center space-x-2 text-base active:scale-[0.98] cursor-pointer">
                <!-- WhatsApp SVG Icon -->
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
                </svg>
                <span>Отправить отчёт в WhatsApp</span>
            </button>
        </form>

        <div id="successModal" class="hidden absolute inset-0 bg-white/95 backdrop-blur-sm p-6 flex flex-col items-center justify-center text-center z-10 transition-all">
            <div class="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center text-4xl mb-4 animate-bounce">
                👍
            </div>
            <h2 class="text-xl font-bold text-slate-900 mb-2">Отлично!</h2>
            <p class="text-slate-600 font-medium mb-6">
                Спасибо, твой отчёт отправлен! 👍
            </p>
            <!-- <button onclick="closeSuccessModal()" 
                class="bg-slate-900 text-white font-semibold py-2.5 px-6 rounded-xl hover:bg-slate-800 transition-all text-sm">
                Заполнить ещё раз
            </button> -->
        </div>

    </div>

    <script>
        /* 
           ========================================================================
           НАСТРОЙКА НОМЕРА ПОЛУЧАТЕЛЯ:
           Укажите ваш номер телефона в международном формате БЕЗ плюса, скобок и тире.
           Пример для России: '79991234567'
           Пример для Украины: '380991234567'
           ========================================================================
        */
        const RECIPIENT_PHONE = '4547207717'; // <-- УКАЖИТЕ ВАШ НОМЕР ТЕЛЕФОНА ЗДЕСЬ

        function handleFormSubmit(event) {
            event.preventDefault();

            // 1. Read input values
            const participatedChecked = document.getElementById('participated').checked;
            const hoursValue = document.getElementById('hours').value.trim();
            const studiesValue = document.getElementById('studies').value.trim();

            // Format values (fallback to 0 if empty)
            const participatedText = participatedChecked ? 'Да' : 'Нет';
            const hoursText = hoursValue !== '' ? hoursValue : '0';
            const studiesText = studiesValue !== '' ? studiesValue : '0';

            // 2. Build formatted report string
            let reportMessage = `📊 *ОТЧЁТ ЗА МЕСЯЦ*\n`;
            reportMessage += `✅ *Участие в служении:* ${participatedText}\n`;
            reportMessage += `⏱️ *Количество часов:* ${hoursText}\n`;
            reportMessage += `📖 *Количество изучений:* ${studiesText}`;

            // 3. Construct WhatsApp URL
            const cleanPhone = RECIPIENT_PHONE.replace(/\D/g, '');
            const encodedText = encodeURIComponent(reportMessage);
            const waUrl = `https://wa.me/${cleanPhone}?text=${encodedText}`;

            // 4. Open WhatsApp in new window/app
            window.open(waUrl, '_blank');

            // 5. Show success notification
            document.getElementById('successModal').classList.remove('hidden');
        }

        function closeSuccessModal() {
            document.getElementById('successModal').classList.add('hidden');
            // Reset fields to default
            document.getElementById('participated').checked = true;
            document.getElementById('hours').value = '';
            document.getElementById('studies').value = '';
        }
    </script>
</body>
</html>
